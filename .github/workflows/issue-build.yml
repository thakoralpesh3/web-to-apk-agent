name: 24/7 Cloud Issue Build Bot

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  issue_build:
    name: Auto-Build APK from Issue
    if: contains(github.event.issue.title, '[Build]') || contains(github.event.issue.title, '[APK]') || contains(github.event.comment.body, '/build') || contains(github.event.issue.body, '/build')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Web URL from Issue
        id: extract
        run: |
          BODY="${{ github.event.comment.body || github.event.issue.body }}"
          URL=$(echo "$BODY" | grep -o -E 'https?://[^ ]+' | head -n 1 || true)
          APP_NAME=$(echo "${{ github.event.issue.title }}" | sed 's/\[.*\]//g' | xargs)
          if [ -z "$APP_NAME" ]; then APP_NAME="WebApp"; fi
          echo "found_url=$URL" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Target Web URL: $URL"
          echo "App Name: $APP_NAME"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y curl wget unzip
          chmod +x ./setup_tools.sh
          ./setup_tools.sh
          pip install -r requirements.txt

      - name: Build APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/Web2APK_Output
          URL="${{ steps.extract.outputs.found_url }}"
          if [ -z "$URL" ]; then URL="https://example.com"; fi
          python agent.py \
            --url "$URL" \
            --name "${{ steps.extract.outputs.app_name }}" \
            --target "smartphone" \
            --fullscreen \
            --no-serve

      - name: Publish APK to Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "issue-${{ github.event.issue.number }}-${{ github.run_number }}"
          name: "APK Build for Issue #${{ github.event.issue.number }} (${{ steps.extract.outputs.app_name }})"
          body: |
            Automatically packaged into Android APK by Web2APK 24/7 Cloud Bot for Issue #${{ github.event.issue.number }}.
          files: /home/runner/Web2APK_Output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reply to Issue with Download Link
        uses: actions/github-script@v7
        with:
          script: |
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/issue-${context.issue.number}-${context.runNumber}`;
            const message = `### 🎉 Web2APK Build Completed Successfully!\n\n` +
              `Your Android APK has been compiled, signed, and published.\n\n` +
              `📦 **Download APK:**\n` +
              `➡️ [Download Signed APK from Release Assets](${releaseUrl})\n\n` +
              `Install the APK on your Android Phone, Tablet, or Android TV.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
