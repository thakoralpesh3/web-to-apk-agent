name: Run Web2APK Packaging Cycle

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Web URL to Package into APK'
        required: false
        default: 'https://example.com'
      app_name:
        description: 'Application Name'
        required: false
        default: 'ExampleApp'
      target_device:
        description: 'Target Device'
        required: true
        default: 'smartphone'
        type: choice
        options:
          - smartphone
          - tv
      fullscreen:
        description: 'Enable Immersive Fullscreen'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish APK directly to GitHub Releases'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [package_apk]

permissions:
  contents: write

jobs:
  package-apk:
    name: Build APK (${{ github.event.inputs.target_device || github.event.client_payload.target_device || 'smartphone' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Java OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y curl wget unzip
          chmod +x ./setup_tools.sh
          ./setup_tools.sh

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Web2APK Packaging
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/Web2APK_Output
          URL="${{ github.event.inputs.url || github.event.client_payload.url || 'https://example.com' }}"
          APP_NAME="${{ github.event.inputs.app_name || github.event.client_payload.app_name || 'ExampleApp' }}"
          DEVICE="${{ github.event.inputs.target_device || github.event.client_payload.target_device || 'smartphone' }}"
          FULLSCREEN_FLAG=""
          if [ "${{ github.event.inputs.fullscreen }}" = "true" ] || [ "${{ github.event.client_payload.fullscreen }}" = "true" ]; then
            FULLSCREEN_FLAG="--fullscreen"
          fi
          python agent.py \
            --url "$URL" \
            --name "$APP_NAME" \
            --target "$DEVICE" \
            $FULLSCREEN_FLAG \
            --no-serve

      - name: Upload Generated APKs
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.event.inputs.target_device || 'smartphone' }}-${{ github.run_number }}
          path: /home/runner/Web2APK_Output/
          retention-days: 30

      - name: Publish to GitHub Releases
        if: ${{ github.event.inputs.publish_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}-apk"
          name: "Web2APK Build #${{ github.run_number }} (${{ github.event.inputs.app_name || 'App' }})"
          body: |
            ### 📱 Web2APK Cloud Build #${{ github.run_number }}
            - **App Name**: `${{ github.event.inputs.app_name || 'App' }}`
            - **Target URL**: `${{ github.event.inputs.url || 'https://example.com' }}`
            - **Target Platform**: `${{ github.event.inputs.target_device || 'smartphone' }}`
            
            Download the signed APK directly from Assets below to install on your Android device or TV.
          files: /home/runner/Web2APK_Output/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
