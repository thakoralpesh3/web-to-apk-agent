version: '3.8'

services:
  web2apk-studio:
    build: .
    container_name: web2apk-ai-studio
    restart: always
    ports:
      - "8990:8990"
    environment:
      - PORT=8990
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6K_OC6ZxwIWBLzkyyXfsidLmLvogxuREg4BoXG_7d7KjA}
    volumes:
      - web2apk_output:/root/Web2APK_Output
      - web2apk_data:/root/.web2apk

volumes:
  web2apk_output:
  web2apk_data:
