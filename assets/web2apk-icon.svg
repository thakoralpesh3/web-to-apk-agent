<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-dasharray="16 12" filter="url(#glow)" opacity="0.8" />

  <!-- Code HTML Bracket < /> on Left -->
  <path d="M 170 190 L 110 256 L 170 322" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 342 190 L 402 256 L 342 322" fill="none" stroke="#a855f7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Android Robot Head & TV Antenna in Center -->
  <!-- Antennas -->
  <line x1="210" y1="180" x2="180" y2="140" stroke="#34d399" stroke-width="12" stroke-linecap="round" />
  <line x1="302" y1="180" x2="332" y2="140" stroke="#34d399" stroke-width="12" stroke-linecap="round" />

  <!-- Android Dome -->
  <path d="M 180 260 A 76 76 0 0 1 332 260 Z" fill="url(#androidGrad)" filter="url(#glow)" />
  
  <!-- Android Eyes -->
  <circle cx="220" cy="225" r="7" fill="#0f172a" />
  <circle cx="292" cy="225" r="7" fill="#0f172a" />

  <!-- Downward Transform Arrow to APK Badge -->
  <path d="M 256 285 L 256 345 M 235 325 L 256 345 L 277 325" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- TV Screen Badge Base -->
  <rect x="200" y="375" width="112" height="65" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
  <text x="256" y="415" font-family="sans-serif" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle">APK</text>
  <line x1="230" y1="440" x2="282" y2="440" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
</svg>
